name: clipping-studio
services:
  db:
    image: mariadb:11
    container_name: db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_NAME}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  backend:
    image: ghcr.io/yudeka-eureka/clipping-studio-backend:latest
    container_name: app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
    environment:
      MYSQL_HOST: db
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_NAME}
    entrypoint: ["sh", "-c"]
    command:
      - "chmod +x /app/clip && /app/clip migrate"
      - "uvicorn app.main:app --host 0.0.0.0 --port 8082"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  frontend:
    image: ghcr.io/yudeka-eureka/clipping-studio-frontend:latest
    container_name: webserver
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  watchtower:
    image: containrrr/watchtower
    container_name: watcher
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Jika repo GHCR kamu private, mount config login docker VPS ke sini:
      - /home/ubuntu/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup

volumes:
  mariadb_data:
  backend_data: