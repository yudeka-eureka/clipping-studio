services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-clipping_studio}
      MARIADB_USER: ${DB_USER:-clipping_user}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  backend:
    image: ghcr.io/yudeka-eureka/clipping-studio-backend:latest
    restart: unless-stopped
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${DB_NAME:-clipping_studio}
      MYSQL_USER: ${DB_USER:-clipping_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  frontend:
    image: ghcr.io/yudeka-eureka/clipping-studio-frontend:latest
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

volumes:
  mariadb_data:
  backend_data:
